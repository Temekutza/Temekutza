<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Temekutza — Software Engineer and Data Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D15"/>
      <stop offset="55%" stop-color="#0D1422"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="52%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity=".03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="278" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" text-anchor="middle">
    <text x="600" y="68" fill="#7D8590" font-size="16" letter-spacing="3">GITHUB / PROFILE</text>
    <text x="600" y="138" fill="#F0F6FC" font-size="54" font-weight="700" letter-spacing="6">TEMEKUTZA</text>
    <rect x="355" y="158" width="490" height="3" rx="2" fill="url(#accent)"/>
    <text x="600" y="202" fill="#C9D1D9" font-size="21" font-weight="600">SOFTWARE ENGINEER  ·  DATA ENGINEER  ·  AI SYSTEMS</text>
    <text x="600" y="239" fill="#7D8590" font-size="15">python · sql · postgresql · fastapi · docker · data · ai</text>
  </g>
</svg>
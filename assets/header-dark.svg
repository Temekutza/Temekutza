  <g transform="translate(72 265)">
    <circle cx="5" cy="0" r="5" fill="#3FB950"/>
    <text x="18" y="5" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">building systems that can actually do things</text>

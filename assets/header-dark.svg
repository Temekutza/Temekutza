<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Temekutza — Software Engineer and Data Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D15"/>
      <stop offset="58%" stop-color="#0C1320"/>
      <stop offset="100%" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="52%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity=".32"/>
      <stop offset="55%" stop-color="#58A6FF" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="278" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
    <text x="78" y="65" fill="#7D8590" font-size="16" letter-spacing="3">GITHUB / PROFILE</text>
    <text x="78" y="134" fill="#F0F6FC" font-size="54" font-weight="700" letter-spacing="6">TEMEKUTZA</text>
    <rect x="78" y="153" width="560" height="3" rx="2" fill="url(#accent)"/>
    <text x="78" y="198" fill="#C9D1D9" font-size="21" font-weight="600">SOFTWARE ENGINEER · DATA ENGINEER · AI SYSTEMS</text>
    <text x="78" y="236" fill="#7D8590" font-size="15">python · sql · postgresql · fastapi · docker · data · ai</text>
  </g>

  <g transform="translate(995 140)">
    <ellipse rx="178" ry="128" fill="url(#halo)"/>

    <circle r="18" fill="#8B5CF6" opacity=".95" filter="url(#glow)">
      <animate attributeName="r" values="16;20;16" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".78;1;.78" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#F0F6FC"/>

    <g fill="none">
      <circle r="44" stroke="#58A6FF" stroke-width="1.5" stroke-opacity=".75" stroke-dasharray="6 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="76" stroke="#8B5CF6" stroke-width="1.4" stroke-opacity=".65" stroke-dasharray="10 12">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="19s" repeatCount="indefinite"/>
      </circle>
      <circle r="108" stroke="#22D3EE" stroke-width="1.25" stroke-opacity=".48" stroke-dasharray="4 13">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="27s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity=".45" fill="none" stroke-width="1">
      <path d="M-118 -36 C-58 -94 58 -94 118 -36" stroke="#58A6FF"/>
      <path d="M-118 36 C-58 94 58 94 118 36" stroke="#8B5CF6"/>
      <path d="M-35 -114 C38 -63 38 63 -35 114" stroke="#22D3EE"/>
    </g>

    <circle r="4.5" fill="#58A6FF" filter="url(#glow)">
      <animateMotion dur="4.8s" repeatCount="indefinite" path="M -118 -36 C -58 -94 58 -94 118 -36 C 58 4 -58 4 -118 -36"/>
    </circle>
    <circle r="4" fill="#8B5CF6" filter="url(#glow)">
      <animateMotion dur="6.2s" repeatCount="indefinite" path="M -118 36 C -58 94 58 94 118 36 C 58 -4 -58 -4 -118 36"/>
    </circle>
    <circle r="3.8" fill="#22D3EE" filter="url(#glow)">
      <animateMotion dur="5.4s" repeatCount="indefinite" path="M -35 -114 C 38 -63 38 63 -35 114 C -90 58 -90 -58 -35 -114"/>
    </circle>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10" fill="#7D8590" text-anchor="middle">
      <text x="0" y="132">DATA CORE</text>
    </g>
  </g>
</svg>
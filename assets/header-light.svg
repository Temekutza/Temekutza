<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Temekutza — AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F6F8FA"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0969DA"/>
      <stop offset="50%" stop-color="#8250DF"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1F2328" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="#1F2328" stroke-opacity=".12"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
    <text x="72" y="62" fill="#656D76" font-size="17">~/github/profile</text>
    <text x="72" y="135" fill="#1F2328" font-size="52" font-weight="700" letter-spacing="2">TEMEKUTZA</text>
    <rect x="72" y="154" width="570" height="3" rx="2" fill="url(#accent)"/>
    <text x="72" y="198" fill="#424A53" font-size="21" font-weight="600">SOFTWARE ENGINEER  //  DATA ENGINEER  //  AI SYSTEMS</text>
    <text x="72" y="240" fill="#656D76" font-size="16">python • sql • postgresql • fastapi • docker • data • ai</text>

    <text x="830" y="92" fill="#0969DA" font-size="17">$ whoami</text>
    <text x="830" y="122" fill="#656D76" font-size="15">artem@temekutza</text>
    <text x="830" y="166" fill="#8250DF" font-size="17">$ status</text>
    <text x="830" y="196" fill="#656D76" font-size="15">building → shipping</text>
    <text x="830" y="240" fill="#0891B2" font-size="17">█</text>
  </g>

  <g transform="translate(72 265)">
    <circle cx="5" cy="0" r="5" fill="#1A7F37"/>
    <text x="18" y="5" fill="#656D76" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14">building systems that can actually do things</text>
  </g>
</svg>